services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: codeportfolio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeportfolio}
      POSTGRES_USER: ${POSTGRES_USER:-codeportfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Backend ASP.NET Core 8 ────────────────────────────────────────────────────
  backend:
    build:
      context: ./codeportfolio-backend
      dockerfile: Dockerfile
    container_name: codeportfolio-backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__CodePortfolioConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-codeportfolio};Username=${POSTGRES_USER:-codeportfolio};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Define JWT_KEY in .env}
      Jwt__Issuer: "CodePortfolioAPI"
      Jwt__Audience: "CodePortfolioClient"
      Jwt__ExpiresInMinutes: "60"
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      Cors__AllowedOrigins__2: "http://localhost:4200"
    ports:
      - "5102:5102"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_images:/app/wwwroot/images
    restart: unless-stopped

  # ── Frontend React + Vite (servido por Nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./codeportfolio-frontend
      dockerfile: Dockerfile
    container_name: codeportfolio-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_images:
